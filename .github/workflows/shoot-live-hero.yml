name: Screenshot live basebloomdesign hero

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to capture
        required: true
        default: https://basebloomdesign.com/

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate a real Chrome
        id: chrome
        run: |
          set -euo pipefail
          # Playwright's bundled chromium has no H.264 decoder, so it would
          # render their mp4 hero as a black box. Use the runner's Google
          # Chrome, which ships the proprietary codecs.
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
            if [ -x "$c" ]; then echo "bin=$c" >> "$GITHUB_OUTPUT"; echo "found $c"; "$c" --version; exit 0; fi
          done
          echo "No Google Chrome on this runner." >&2
          exit 1

      - name: Capture
        env:
          PAGE_URL: ${{ inputs.url }}
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright-core
          mkdir -p .live-shots
          cat > ./shoot-live.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const URL = process.env.PAGE_URL;
          const b = await chromium.launch({
            executablePath: process.env.CHROME_BIN,
            args: ['--autoplay-policy=no-user-gesture-required', '--no-sandbox'],
          });
          const out = [];
          for (const [label, viewport] of [['desktop', {width:1440,height:900}], ['mobile', {width:390,height:844}]]) {
            const ctx = await b.newContext({ viewport, deviceScaleFactor: 2 });
            const page = await ctx.newPage();
            const hosts = new Set();
            page.on('request', r => { try { hosts.add(new global.URL(r.url()).host); } catch {} });
            await page.goto(URL, { waitUntil: 'load', timeout: 45000 });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(2500);
            const info = await page.evaluate(() => {
              const v = document.querySelector('video');
              const h1 = document.querySelector('h1');
              const em = document.querySelector('h1 em, h1 i, h1 span');
              const faces = [...new Set([...document.fonts].filter(f=>f.status==='loaded').map(f=>`${f.family} ${f.style} ${f.weight}`))].sort();
              let bright = null;
              if (v && v.videoWidth) {
                const c = document.createElement('canvas'); c.width=160; c.height=90;
                const g = c.getContext('2d'); g.drawImage(v,0,0,160,90);
                const d = g.getImageData(0,0,160,90).data;
                let sum=0, nb=0; const n=d.length/4;
                for (let i=0;i<d.length;i+=4){ const l=d[i]*.299+d[i+1]*.587+d[i+2]*.114; sum+=l; if(l>12)nb++; }
                bright = { mean:+(sum/n).toFixed(1), nonBlackPct:+(100*nb/n).toFixed(1) };
              }
              return {
                video: v ? { src: v.currentSrc, readyState: v.readyState, paused: v.paused,
                             t: +v.currentTime.toFixed(2), duration: +(v.duration||0).toFixed(2),
                             w: v.videoWidth, h: v.videoHeight } : 'NO VIDEO ELEMENT',
                bright,
                h1Text: h1 ? h1.innerText.replace(/\n/g,' / ') : null,
                h1Family: h1 ? getComputedStyle(h1).fontFamily : null,
                emFamily: em ? getComputedStyle(em).fontFamily : null,
                loadedFaces: faces,
                title: document.title,
              };
            });
            await page.screenshot({ path: `.live-shots/live-${label}.png` });
            out.push({ label, ...info, hosts: [...hosts].sort() });
            await ctx.close();
          }
          await b.close();
          console.log(JSON.stringify(out, null, 2));
          JS
          node ./shoot-live.mjs | tee .live-shots/report.json

      - name: Commit shots
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .live-shots
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Live basebloomdesign hero screenshots (temp)"
          git push origin HEAD:${{ github.ref_name }}
