name: Fetch hero assets

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: URL of the generated hero.mp4
        required: true
      assembled_url:
        description: URL of the assembled house image
        required: false
        default: ''
      exploded_url:
        description: URL of the exploded house image
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Download video
        run: |
          curl -fSL "${{ github.event.inputs.video_url }}" -o hero.mp4
          ls -la hero.mp4

      - name: Probe video
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 hero.mp4

      - name: Extract frames
        run: |
          mkdir -p frames
          ffmpeg -i hero.mp4 -vf "fps=24,scale=1920:-1" -q:v 3 "frames/frame_%04d.jpg"
          FRAME_COUNT=$(ls frames | wc -l)
          echo "FRAME_COUNT=$FRAME_COUNT" >> "$GITHUB_ENV"
          echo "Extracted $FRAME_COUNT frames"

      - name: Stage assets
        run: |
          mkdir -p public/frames public/assets
          cp frames/*.jpg public/frames/
          cp hero.mp4 public/hero.mp4
          if [ -n "${{ github.event.inputs.assembled_url }}" ]; then
            curl -fSL "${{ github.event.inputs.assembled_url }}" -o public/assets/house-assembled.png
          fi
          if [ -n "${{ github.event.inputs.exploded_url }}" ]; then
            curl -fSL "${{ github.event.inputs.exploded_url }}" -o public/assets/house-exploded.png
          fi

      - name: Update FRAME_COUNT constant
        run: |
          cat > app/components/frameCount.ts <<EOF
          // Updated automatically after frame extraction from public/hero.mp4
          export const FRAME_COUNT = ${FRAME_COUNT};
          EOF
          cat app/components/frameCount.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public app/components/frameCount.ts
          git commit -m "Add hero video, extracted frames ($FRAME_COUNT), and reference images"
          git push
