name: Fetch bloom assets

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: URL of the 4K hero video
        required: true
      stance_url:
        description: URL of the 4K stance still
        required: true
      fire_url:
        description: URL of the 4K Sacred Fire still
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Download and extract
        run: |
          curl -fSL "${{ github.event.inputs.video_url }}" -o hero.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 hero.mp4
          mkdir -p bloom-typhlosion/frames bloom-typhlosion/assets
          ffmpeg -i hero.mp4 -vf "fps=24,scale=2560:-2" -q:v 2 "bloom-typhlosion/frames/frame_%04d.jpg"
          echo "Extracted $(ls bloom-typhlosion/frames | wc -l) frames"
          cp hero.mp4 bloom-typhlosion/hero.mp4
          curl -fSL "${{ github.event.inputs.stance_url }}" -o bloom-typhlosion/assets/typhlosion-stance.png
          curl -fSL "${{ github.event.inputs.fire_url }}" -o bloom-typhlosion/assets/typhlosion-sacred-fire.png

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloom-typhlosion
          git commit -m "Add Typhlosion bloom assets: 4K video, $(ls bloom-typhlosion/frames | wc -l) frames, 4K stills"
          git push
