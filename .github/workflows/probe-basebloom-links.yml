name: Probe basebloom demo links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe every demo path on both hosts
        run: |
          set -uo pipefail
          OLD="https://basebloom-concepts.netlify.app"
          NEW="https://basebloomdesign.com"

          PATHS="
          /slate-and-storm/
          /ember-and-air/
          /copper-and-spring/
          /site-1-classic/
          /beam-and-bedrock/
          /linen-and-light/
          /ochre-and-ivory/
          /grain-and-grove/
          /site-2/
          /site-3/
          /site-4/
          /site-5/
          /site-6/
          /site-7/
          /site-8/
          /site-9/
          /craft-landscaping/
          /craft-roofing/
          /craft-plumbing/
          /craft-construction/
          /craft-cleaning/
          /craft-hvac/
          /craft-painting/
          /craft-carpentry/
          /craft-realty/
          /assembly-landscaping/
          /assembly-roofing/
          /assembly-plumbing/
          /assembly-construction/
          /assembly-cleaning/
          /assembly-hvac/
          /assembly-painting/
          /assembly-carpentry/
          /assembly-realty/
          "

          # A Netlify 404 page still returns a body; distinguish real pages by
          # final status AND by the effective URL not collapsing to the root.
          probe() {
            local url="$1"
            local code eff
            read -r code eff < <(curl -sS -o /tmp/p.html -w "%{http_code} %{url_effective}" -L --max-time 25 "$url" || echo "000 -")
            local size
            size=$(stat -c%s /tmp/p.html 2>/dev/null || echo 0)
            echo "$code|$size|$eff"
          }

          printf '%-26s | %-22s | %-22s\n' "PATH" "OLD HOST" "NEW HOST"
          printf '%.0s-' {1..78}; echo

          : > /tmp/results.txt
          for p in $PATHS; do
            [ -z "$p" ] && continue
            o=$(probe "$OLD$p"); n=$(probe "$NEW$p")
            oc=${o%%|*}; os=$(echo "$o" | cut -d'|' -f2)
            nc=${n%%|*}; ns=$(echo "$n" | cut -d'|' -f2)
            printf '%-26s | %-22s | %-22s\n' "$p" "$oc (${os}b)" "$nc (${ns}b)"
            echo "$p|$oc|$os|$nc|$ns" >> /tmp/results.txt
          done

          echo
          echo "=== absolute link"
          a=$(probe "https://verdant-and-stone.netlify.app/")
          echo "verdant-and-stone.netlify.app -> $a"

          echo
          echo "=== summary"
          echo "OLD host 200s: $(awk -F'|' '$2==200' /tmp/results.txt | wc -l) / $(wc -l < /tmp/results.txt)"
          echo "NEW host 200s: $(awk -F'|' '$4==200' /tmp/results.txt | wc -l) / $(wc -l < /tmp/results.txt)"
          echo
          echo "=== paths dead on BOTH hosts"
          awk -F'|' '$2!=200 && $4!=200 {print $1}' /tmp/results.txt || true
          echo "=== paths alive on NEW only"
          awk -F'|' '$2!=200 && $4==200 {print $1}' /tmp/results.txt || true
          echo "=== paths alive on OLD only"
          awk -F'|' '$2==200 && $4!=200 {print $1}' /tmp/results.txt || true
